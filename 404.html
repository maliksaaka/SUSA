function loadTrack(t){au.pause();P.kind='sc';P.key='tr:'+t.url;P.t=0;P.d=t.dur;P.playing=false;$('#pt').textContent=clean(t.title);ui();
 scDo(()=>scw.load(t.url,{auto_play:true,show_comments:false,callback:()=>{scw.setVolume(50);scw.play()}}))}
function playCur(){P.kind==='sc'?scDo(()=>scw.play()):au.play().catch(()=>{})}
function pauseCur(){P.kind==='sc'?scw&&scw.pause():au.pause()}
au.ontimeupdate=()=>{if(P.kind!=='mp3')return;P.t=au.currentTime;P.d=au.duration;ui()};
au.onplay=()=>{if(P.kind!=='mp3')return au.pause();if(scw)scw.pause();P.playing=true;ui()};
au.onpause=()=>{if(P.kind==='mp3'){P.playing=false;ui()}};
$('#pp').onclick=e=>{e.stopPropagation();P.playing?pauseCur():playCur()};
$('#bar').onclick=e=>{const r=e.currentTarget.getBoundingClientRect(),x=(e.clientX-r.left)/r.width;if(!P.d)return;
 if(P.kind==='sc')scw.seekTo(x*P.d*1000);else au.currentTime=x*P.d};
document.addEventListener('click',e=>{const b=e.target.closest('[data-tr]');if(!b)return;const t=D.tracks[+b.dataset.tr];
 if(P.key==='tr:'+t.url){P.playing?pauseCur():playCur()}else loadTrack(t)});
if(D.episodes.length){load(D.episodes[Math.floor(Math.random()*Math.min(3,D.episodes.length))]);
 au.play().catch(()=>{const u=ev=>{['click','touchend','keydown'].forEach(t=>removeEventListener(t,u,true));if(ev.target.closest&&ev.target.closest('#pp,[data-ep],[data-tr]'))return;if(P.kind==='mp3')au.play().catch(()=>{})};['click','touchend','keydown'].forEach(t=>addEventListener(t,u,true))})}
else{$('#pt').innerHTML=`<a class="u" href="${SPOTIFY}" target="_blank" rel="noopener">Listen on Spotify &rarr;&#xFE0E;</a>`;$('#pp').style.display='none'}

// desktop row hover: the episode's single figure as a small still near the cursor (lazy, image only)
const HOV=matchMedia('(hover:hover) and (pointer:fine)');let hv=null;
const figOf=i=>PETS[(D.episodes.length-i)%PETS.length];
document.addEventListener('mouseover',e=>{if(!HOV.matches)return;const b=e.target.closest('.list li');const k=b&&b.querySelector('[data-ep]');
 if(!k){if(hv)hv.classList.remove('on');return}if(!hv){hv=document.createElement('img');hv.id='hv';hv.alt='';hv.decoding='async';document.body.appendChild(hv)}
 const f='/img/'+figOf(+k.dataset.ep)+'-cream.png';if(!hv.src.endsWith(f))hv.src=f;hv.classList.add('on')});
document.addEventListener('mousemove',e=>{if(hv&&hv.classList.contains('on'))hv.style.transform=`translate(${e.clientX+24}px,${e.clientY-48}px)`},{passive:true});
// scroll reveal
const IO='IntersectionObserver'in window&&!RM()?new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');IO.unobserve(x.target)}}),{rootMargin:'0px 0px -8% 0px'}):null;
function reveal(){document.querySelectorAll('#app .wrap>*,#app .epg>*,#app .bio>*,#app .rv').forEach(el=>{if(!IO){el.classList.add('in');return}el.classList.add('rv');IO.observe(el)})}
route();cartFetch();

(()=>{const x=document.createElement('div');x.id='bgx';x.setAttribute('aria-hidden','true');x.innerHTML='<div class="ga ga1"></div><div class="ga ga2"></div>';document.body.prepend(x);
const rm=matchMedia('(prefers-reduced-motion:reduce)').matches,a=x.children;let raf=0,tx=.3,ty=.25,cx=.3,cy=.25;
function frame(){raf=0;const W=innerWidth,H=innerHeight,t=performance.now()/1000;cx+=(tx-cx)*.04;cy+=(ty-cy)*.04;
 const dx=rm?0:Math.sin(t*.07)*.08,dy=rm?0:Math.cos(t*.05)*.06,sp=Math.min(1,scrollY/(document.documentElement.scrollHeight-H||1));
 a[0].style.transform=`translate3d(${((cx+dx)*W).toFixed(1)}px,${((cy+dy+sp*.5)*H).toFixed(1)}px,0)`;
 a[1].style.transform=`translate3d(${((1-cx*.8-dx)*W).toFixed(1)}px,${((.85-cy*.6-sp*.4)*H).toFixed(1)}px,0)`;
 if(!rm&&!document.hidden)raf=requestAnimationFrame(frame)}
const tick=()=>{if(!raf)raf=requestAnimationFrame(frame)};
addEventListener('resize',tick,{passive:true});
if(!rm){addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;tx=e.clientX/innerWidth-.25;ty=e.clientY/innerHeight-.3;tick()},{passive:true});addEventListener('scroll',tick,{passive:true});document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()})}
tick()})();
</script></body></html>
